<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>텍사스 홀덤 포커 (Texas Hold'em)</title>
  <meta name="description" content="모바일 최적화 프리미엄 텍사스 홀덤 카지노 테이블 UI">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 메인 모바일 컨테이너 -->
  <div id="game-container" class="game-container">
    
    <!-- 카지노 포커 테이블 프레임 -->
    <main class="poker-table">
      <!-- 테이블 외곽 골드 림 & 우드 레일 장식 레이어 -->
      <div class="table-rail"></div>
      <div class="table-felt">
        
        <!-- 테이블 상단 헤더 / 카지노 로고 -->
        <header class="table-header">
          <div class="casino-badge">
            <span class="badge-icon">♠</span>
            <span class="badge-title">TEXAS HOLD'EM</span>
            <span class="badge-icon">♦</span>
          </div>
        </header>

        <!-- 봇 2 자리 (상단 중앙) -->
        <div class="seat seat-top" id="seat-bot-2" aria-label="Bot 2 자리">
          <div class="player-info-pill">
            <span class="player-avatar">🤖</span>
            <span class="player-name">Bot 2</span>
            <span class="player-chips">$1,000</span>
          </div>
          <div class="bot-cards" aria-label="Bot 2 홀 카드">
            <div class="card-facedown card-tilt-left" title="Bot 2 Card 1">
              <div class="card-inner-pattern">♠</div>
            </div>
            <div class="card-facedown card-tilt-right" title="Bot 2 Card 2">
              <div class="card-inner-pattern">♦</div>
            </div>
          </div>
        </div>

        <!-- 봇 1 자리 (좌측 측면) -->
        <div class="seat seat-left" id="seat-bot-1" aria-label="Bot 1 자리">
          <div class="player-info-pill">
            <span class="player-avatar">🤖</span>
            <span class="player-name">Bot 1</span>
            <span class="player-chips">$1,000</span>
          </div>
          <div class="bot-cards" aria-label="Bot 1 홀 카드">
            <div class="card-facedown card-tilt-left" title="Bot 1 Card 1">
              <div class="card-inner-pattern">♣</div>
            </div>
            <div class="card-facedown card-tilt-right" title="Bot 1 Card 2">
              <div class="card-inner-pattern">♥</div>
            </div>
          </div>
        </div>

        <!-- 중앙 테이블 영역: 메인 팟 & 커뮤니티 카드 5장 -->
        <div class="table-center-area">
          <div class="pot-display" id="pot-display">
            <span class="pot-label">TOTAL POT</span>
            <span class="pot-amount" id="pot-amount">$0</span>
          </div>

          <section class="community-card-section" aria-label="커뮤니티 카드 영역">
            <div class="section-title">COMMUNITY CARDS</div>
            <div class="card-slots community-slots" id="community-slots">
              <div class="card-slot" data-slot="flop-1" title="Flop 1">
                <span class="slot-watermark">?</span>
              </div>
              <div class="card-slot" data-slot="flop-2" title="Flop 2">
                <span class="slot-watermark">?</span>
              </div>
              <div class="card-slot" data-slot="flop-3" title="Flop 3">
                <span class="slot-watermark">?</span>
              </div>
              <div class="card-slot" data-slot="turn" title="Turn">
                <span class="slot-watermark">?</span>
              </div>
              <div class="card-slot" data-slot="river" title="River">
                <span class="slot-watermark">?</span>
              </div>
            </div>
          </section>
        </div>

        <!-- 봇 3 자리 (우측 측면) -->
        <div class="seat seat-right" id="seat-bot-3" aria-label="Bot 3 자리">
          <div class="player-info-pill">
            <span class="player-avatar">🤖</span>
            <span class="player-name">Bot 3</span>
            <span class="player-chips">$1,000</span>
          </div>
          <div class="bot-cards" aria-label="Bot 3 홀 카드">
            <div class="card-facedown card-tilt-left" title="Bot 3 Card 1">
              <div class="card-inner-pattern">♠</div>
            </div>
            <div class="card-facedown card-tilt-right" title="Bot 3 Card 2">
              <div class="card-inner-pattern">♦</div>
            </div>
          </div>
        </div>

        <!-- 하단: 플레이어 1(내 자리) 핸드 및 정보 영역 -->
        <section class="seat seat-bottom player-section" id="seat-player-1" aria-label="내 자리 (PLAYER 1)">
          <div class="section-title">YOUR HAND</div>
          <div class="card-slots player-slots" id="player-slots">
            <div class="card-slot player-card-slot" data-slot="hole-1" title="Hole Card 1">
              <span class="slot-watermark">🂠</span>
            </div>
            <div class="card-slot player-card-slot" data-slot="hole-2" title="Hole Card 2">
              <span class="slot-watermark">🂠</span>
            </div>
          </div>
          <div class="player-info-pill player-main-pill">
            <span class="player-avatar">👤</span>
            <span class="player-name">PLAYER 1</span>
            <span class="player-chips" id="player-chips">$1,000</span>
          </div>
        </section>

      </div>
    </main>

    <!-- 화면 맨 아래: 베팅 조작 액션 바 -->
    <nav class="betting-action-bar" aria-label="베팅 컨트롤">
      <button type="button" class="action-btn btn-fold" id="btn-fold" aria-label="폴드 (다이)">
        <span class="btn-text">FOLD</span>
        <span class="btn-subtext">포기</span>
      </button>
      <button type="button" class="action-btn btn-call" id="btn-call" aria-label="콜">
        <span class="btn-text">CALL</span>
        <span class="btn-subtext">체크 / 받기</span>
      </button>
      <button type="button" class="action-btn btn-raise" id="btn-raise" aria-label="레이즈">
        <span class="btn-text">RAISE</span>
        <span class="btn-subtext">올리기</span>
      </button>
    <!-- 게임 종료 UI 모달 -->
    <div id="game-modal" class="game-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-icon">🏆</div>
        <h2 id="modal-title" class="modal-title">게임 종료!</h2>
        <p class="modal-subtitle">승자 판독 엔진 개발 필요</p>
        
        <div class="modal-pot-box">
          <span class="modal-pot-label">FINAL POT</span>
          <span class="modal-pot-val" id="modal-pot-val">$0</span>
        </div>

        <button type="button" class="btn-next-hand" id="btn-next-hand">
          <span class="next-btn-text">NEXT HAND (다음 판)</span>
        </button>
      </div>
    </div>

  </div>

  <!-- 사운드 이펙트 오디오 태그 -->
  <audio id="sound-bet" preload="auto"></audio>
  <audio id="sound-card" preload="auto"></audio>
  <audio id="sound-win" preload="auto"></audio>

  <script src="js/hand-evaluator.js"></script>
  <script src="js/ai-bot.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
